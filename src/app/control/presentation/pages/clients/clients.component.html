<mat-sidenav-container class="sidenav-container">
  <mat-sidenav mode="side" opened class="sidenav">
    <div class="logo-container">
      <img src="assets/logo-fueltrack.png" class="logo-icon" />
    </div>
    <mat-nav-list>
      <a mat-list-item *ngFor="let item of navItems"
         [routerLink]="item.route"
         [ngClass]="{ 'nav-item': true, 'active': isActive(item.route) }">
        <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="main-content">
    <div class="page-header">
      <div class="title-block">
        <h1>Clients</h1>
        <p>Manage registered clients in the platform</p>
      </div>
    </div>

    <div class="card-grid">
      <mat-card *ngFor="let client of clients" class="client-card">
        <mat-card-header>
          <mat-card-title>{{ client.name }}</mat-card-title>
          <mat-card-subtitle>RUC: {{ client.ruc }}</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <p>Status: <strong [ngClass]="{
            'status-active': client.status === 'Active',
            'status-inactive': client.status === 'Inactive'
          }">{{ client.status }}</strong></p>
        </mat-card-content>
        <mat-card-actions>
          <button mat-stroked-button color="accent">
            <mat-icon>edit</mat-icon> Edit
          </button>
        </mat-card-actions>
      </mat-card>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
