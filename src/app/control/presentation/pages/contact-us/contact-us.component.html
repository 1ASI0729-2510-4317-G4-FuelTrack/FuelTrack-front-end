<h2 class="section-title">Contact Us</h2>

<p class="description">Have questions or need help? Fill out the form and our team will get back to you shortly.</p>

<form class="contact-form" (ngSubmit)="submitForm()" #contactForm="ngForm">
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Name</mat-label>
    <input matInput name="name" [(ngModel)]="contact.name" required>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Email</mat-label>
    <input matInput type="email" name="email" [(ngModel)]="contact.email" required>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Message</mat-label>
    <textarea matInput rows="5" name="message" [(ngModel)]="contact.message" required></textarea>
  </mat-form-field>

  <button mat-raised-button color="primary" type="submit" [disabled]="!contactForm.valid">Send Message</button>
</form>
