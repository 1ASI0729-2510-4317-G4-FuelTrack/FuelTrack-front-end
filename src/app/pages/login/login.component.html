<header class="header">
  <div class="logo">FuelTrack</div>
  <nav class="nav">
    <a href="#" class="nav-link">Inicio</a>
    <a href="#" class="nav-link">Servicios</a>
    <a href="#" class="nav-link">Contacto</a>
  </nav>
  <div class="auth-buttons">
    <button class="register-btn" routerLink="/register">Registrarse</button>
  </div>
</header>

<div class="login-container">
  <div class="login-card">
    <img src="assets/logo-fueltrack.png" alt="FuelTrack Logo" class="logo">
    <h1>FuelTrack</h1>

    <h2>{{ isClient ? 'Inicio de sesión de cliente' : 'Inicio de sesión de proveedor' }}</h2>

    <form (ngSubmit)="login()">
      <ng-container *ngIf="isClient; else supplierForm">
        <input type="email" [(ngModel)]="email" name="email" placeholder="Email Address" required />
      </ng-container>

      <ng-template #supplierForm>
        <input type="text" [(ngModel)]="ruc" name="ruc" placeholder="RUC Number" required pattern="\\d{11}" />
      </ng-template>

      <input type="password" [(ngModel)]="password" name="password" placeholder="Password" required />
      <button type="submit">Iniciar sesión</button>
    </form>

    <p class="register">
      {{ isClient ? 'No es un cliente?' : 'No es un proveedor?' }}
      <a href="#" (click)="toggleLogin(); $event.preventDefault()">Click aqui</a>
    </p>
  </div>
</div>
