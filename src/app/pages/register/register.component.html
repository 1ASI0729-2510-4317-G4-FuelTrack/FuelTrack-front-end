<header class="header">
  <div class="logo">FuelTrack</div>
  <nav class="nav">
    <a href="#" class="nav-link">Inicio</a>
    <a href="#" class="nav-link">Servicios</a>
    <a href="#" class="nav-link">Contacto</a>
  </nav>
  <div class="auth-buttons">
    <button class="login-btn" routerLink="/login">Iniciar sesión</button>
  </div>
</header>


  <div class="register-container">
  <h2>Registro</h2>

  <div class="role-selector">
    <button [class.active]="isClient" (click)="toggleRole('client')">Solicitante</button>
    <button [class.active]="!isClient" (click)="toggleRole('supplier')">Proveedor</button>
  </div>

  <form (ngSubmit)="register()">
    <label>Email:</label>
    <input type="email" [(ngModel)]="email" name="email" required />

    <label>DNI:</label>
    <input type="text" [(ngModel)]="dni" name="dni" required />

    <div *ngIf="!isClient">
      <label>RUC:</label>
      <input type="text" [(ngModel)]="ruc" name="ruc" required />
    </div>

    <label>Contraseña:</label>
    <input type="password" [(ngModel)]="password" name="password" required />

    <button type="submit">Registrarse</button>
  </form>
</div>
