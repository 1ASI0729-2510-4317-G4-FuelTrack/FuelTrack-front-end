<mat-sidenav-container class="sidenav-container">
  <mat-sidenav mode="side" opened class="sidenav">
    <div class="logo-container">
      <img src="assets/logo-fueltrack.png" class="logo-icon" />
    </div>
    <mat-nav-list>
      <a mat-list-item *ngFor="let item of navItems"
         [routerLink]="item.route"
         [ngClass]="{ 'nav-item': true, 'active': isActive(item.route) }">
        <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="main-content">
    <div class="page-header">
      <div class="title-block">
        <h1>Sales Report</h1>
        <p>Monitor monthly sales performance</p>
      </div>
    </div>
    <div style="max-width: 700px; margin: 0 auto; background: #22314b; padding: 2rem; border-radius: 12px;">
      <canvas baseChart
        [data]="barChartData"
        [options]="barChartOptions"
        [type]="'bar'">
      </canvas>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
